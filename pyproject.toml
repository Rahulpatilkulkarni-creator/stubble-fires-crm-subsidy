[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-policy"
version = "0.1.0"
description = "Stubble-burning fires vs. crop-residue subsidy policy: causal DiD + spatiotemporal prediction"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
